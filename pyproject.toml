[project]
name = "ai-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",           # PostgreSQL 비동기 드라이버 (SQLAlchemy async 엔진이 사용)
    "fastapi>=0.139.0",          # 웹 API 프레임워크
    "greenlet>=3.5.3",           # SQLAlchemy async 실행에 필요한 런타임 의존성
    "httpx>=0.28.0",             # 임베딩 서버 등 외부 서비스 async HTTP 호출
    "pgvector>=0.5.0",           # pgvector 확장 연동 (Vector 컬럼 타입 제공)
    "pydantic-settings>=2.14.2", # .env 환경변수 로딩/설정 관리 (Settings)
    "sqlmodel>=0.0.39",          # ORM + Pydantic 모델 (SQLAlchemy 기반, DB 모델 정의)
    "uvicorn[standard]>=0.51.0", # ASGI 서버 (FastAPI 앱 구동)
]

[project.optional-dependencies]
# bge-m3 임베딩 서빙 전용 (torch/transformers 포함, 무거움).
# 메인 API에는 불필요 → 별도 그룹으로 분리. 설치: uv sync --extra embedding
embedding = [
    "FlagEmbedding>=1.3.0",      # bge-m3 dense/sparse 임베딩 모델 래퍼
]
