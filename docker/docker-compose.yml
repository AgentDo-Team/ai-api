services:
  db:
    image: paradedb/paradedb:latest 
    container_name: ai-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: edudb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu -d edudb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: