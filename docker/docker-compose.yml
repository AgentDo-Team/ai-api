services:
  db:
    image: paradedb/paradedb:latest # PostgreSQL(18) + pgvector + pg_search(BM25)
    container_name: ai-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: edudb
    ports:
      - "5432:5432"
    volumes:
      # PG18+ 는 데이터를 /var/lib/postgresql 하위 버전별 디렉토리에 저장한다.
      # (pg16 시절의 /var/lib/postgresql/data 경로로 마운트하면 컨테이너가 기동 실패)
      - pgdata:/var/lib/postgresql
      # 컨테이너 최초 기동 시 1회 실행되는 초기화 스크립트 (pgvector 확장 생성)
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu -d edudb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: